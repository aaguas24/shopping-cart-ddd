spring.application.name=shopping-cart-ddd

# Datasource H2
spring.datasource.url=jdbc:h2:mem:shoppingcartdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL init
spring.sql.init.mode=always

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080
## Agregar comentarios con info de entidad/fetch
spring.jpa.properties.hibernate.use_sql_comments=true

## Logging (controlar por logger)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
## Ver plan de carga y consultas de fetch (opcional y verboso)
logging.level.org.hibernate.loader=DEBUG
logging.level.org.hibernate.engine.internal.JoinSequence=DEBUG

spring.activemq.in-memory=true
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.packages.trust-all=true
spring.activemq.pool.enabled=false
