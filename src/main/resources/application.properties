spring.application.name=shopping-cart-ddd

# Datasource PostgreSQL (sobrescribible mediante variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Carga los datos de ejemplo al iniciar; data.sql usa sintaxis de PostgreSQL.
spring.sql.init.mode=never

# Server
server.port=8081
## Agregar comentarios con info de entidad/fetch
spring.jpa.properties.hibernate.use_sql_comments=true

## Logging (controlar por logger)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
## Ver plan de carga y consultas de fetch (opcional y verboso)
logging.level.org.hibernate.loader=DEBUG
logging.level.org.hibernate.engine.internal.JoinSequence=DEBUG


# Kafka
# Servidor Kafka en Aiven
spring.kafka.bootstrap-servers=kafka-shopping-andresaguas360-46c8.b.aivencloud.com:17004

# Seguridad SASL_SSL
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASS}";

# Serializadores / Deserializadores básicos (String)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=shopping-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.properties.ssl.truststore.location=${KAFKA_TRUSTSTORE_PATH}
spring.kafka.properties.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
spring.kafka.properties.ssl.truststore.type=PKCS12

app.kafka.producto-registrado=producto.registrado
app.kafka.producto-imagen-actualizado=producto.imagen.actualizado

app.kafka.topics[0].name=producto.registrado
app.kafka.topics[0].partitions=3
app.kafka.topics[0].replicas=1

app.kafka.topics[1].name=producto.imagen.actualizado
app.kafka.topics[1].partitions=3
app.kafka.topics[1].replicas=1